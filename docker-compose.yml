services:
  web:
    image: php:8.2-apache
    container_name: jobconnect-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: job_recruitment
      DB_USER: root
      DB_PASS: root
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql
      && apache2-foreground"

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobconnect-laravel:8.4
    container_name: jobconnect-laravel
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      # Mount only app source — keep vendor inside the image (Windows bind mounts are very slow)
      - ./backend/app:/var/www/html/app
      - ./backend/routes:/var/www/html/routes
      - ./backend/config:/var/www/html/config
      - ./backend/bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./backend/.env:/var/www/html/.env
      - ./uploads:/var/www/uploads
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: job_recruitment
      DB_USERNAME: root
      DB_PASSWORD: root
      API_SECRET: jobconnect_api_secret_change_me
      FRONTEND_URL: http://localhost:3000
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  db:
    image: mysql:8.0
    container_name: jobconnect-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_recruitment
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - jobconnect_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jobconnect_mysql_data:
